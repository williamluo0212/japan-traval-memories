# 推送到 main（含合并投稿 PR）后自动构建网站并发布到 GitHub Pages
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 缩略图缓存：照片没变时秒级复用，只有新照片才重新处理。
      # 输出格式/管线变更时递增 key 里的版本号（v2 = JPEG 改为 AVIF）。
      - uses: actions/cache@v4
        with:
          path: .cache
          key: photos-cache-v2-avif-${{ hashFiles('photos/**') }}
          restore-keys: photos-cache-v2-avif-

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

# 手动触发入口：仓库 Actions 页 → build-and-deploy → Run workflow
